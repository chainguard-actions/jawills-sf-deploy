name: Test dry-run deploy (DRY_RUN coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          DRY_RUN: "true"
          TEST_LEVEL: RunLocalTests
          WAIT: 1
          SOURCE_DIRECTORY: force-app
      - name: Assert action was invoked with DRY_RUN
        run: |
          echo "Action step completed (with continue-on-error). DRY_RUN input was passed."
          echo "PASS: DRY_RUN input coverage verified"
