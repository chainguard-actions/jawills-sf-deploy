name: Test custom test level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory for manifest generation
        run: |
          mkdir -p force-app/main/default
          echo "PASS: source directory created"

      - name: Attempt action with TEST_LEVEL=NoTestRun (expected to fail at login)
        id: action_no_test
        uses: .
        continue-on-error: true
        with:
          DRY_RUN: "false"
          TEST_LEVEL: NoTestRun
          WAIT: 10
          SOURCE_DIRECTORY: force-app
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@invalid.salesforce.com"

      - name: Assert action failed at login with NoTestRun level
        env:
          OUTCOME: ${{ steps.action_no_test.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid SFDX_AUTH_URL) with NoTestRun"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Attempt action with TEST_LEVEL=RunAllTestsInOrg (expected to fail at login)
        id: action_all_tests
        uses: .
        continue-on-error: true
        with:
          DRY_RUN: "false"
          TEST_LEVEL: RunAllTestsInOrg
          WAIT: 10
          SOURCE_DIRECTORY: force-app
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@invalid.salesforce.com"

      - name: Assert action failed at login with RunAllTestsInOrg level
        env:
          OUTCOME: ${{ steps.action_all_tests.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid SFDX_AUTH_URL) with RunAllTestsInOrg"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
