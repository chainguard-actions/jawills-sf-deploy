name: Test custom inputs (test level and wait)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom source directory
        run: |
          mkdir -p src/main/default/classes
          cat > src/main/default/classes/SampleClass.cls << 'EOF'
          public class SampleClass {
              public static String greet(String name) {
                  return 'Hello, ' + name;
              }
          }
          EOF
          cat > src/main/default/classes/SampleClass.cls-meta.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <ApexClass xmlns="http://soap.sforce.com/2006/04/metadata">
              <apiVersion>58.0</apiVersion>
              <status>Active</status>
          </ApexClass>
          EOF

      - name: Run action with custom inputs (expect failure at login — no real org)
        id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          DRY_RUN: "false"
          TEST_LEVEL: "NoTestRun"
          WAIT: "10"
          SOURCE_DIRECTORY: "src"

      - name: Assert Salesforce CLI was installed before login failure
        run: |
          if ! command -v sf &> /dev/null; then
            echo "FAIL: sf CLI not found in PATH — Install step did not run"
            exit 1
          fi
          echo "PASS: sf CLI is available (Install step ran successfully)"
          sf --version
