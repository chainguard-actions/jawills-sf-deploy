name: Test basic deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy source directory
        run: mkdir -p force-app
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@test.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: 30
          SOURCE_DIRECTORY: force-app
      - name: Assert action was invoked with SFDX_AUTH_URL
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at login since we have no real org.
          # We verify it ran (not skipped) and reached the login step.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with SFDX_AUTH_URL input"
