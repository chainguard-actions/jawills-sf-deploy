name: Test manifest generation with default source directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default source directory (force-app)
        run: |
          mkdir -p force-app/main/default/classes
          cat > force-app/main/default/classes/MyClass.cls << 'EOF'
          public class MyClass {
              public static void run() {
                  System.debug('Running');
              }
          }
          EOF
          cat > force-app/main/default/classes/MyClass.cls-meta.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <ApexClass xmlns="http://soap.sforce.com/2006/04/metadata">
              <apiVersion>58.0</apiVersion>
              <status>Active</status>
          </ApexClass>
          EOF
          echo "Created force-app source directory with sample Apex class"

      - name: Run action with default source directory (expect failure at login — no real org)
        id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          SOURCE_DIRECTORY: "force-app"

      - name: Assert Salesforce CLI was installed before login failure
        run: |
          if ! command -v sf &> /dev/null; then
            echo "FAIL: sf CLI not found in PATH — Install step did not run"
            exit 1
          fi
          echo "PASS: sf CLI is available (Install step ran successfully)"
          sf --version
