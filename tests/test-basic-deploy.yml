name: Test basic deploy (SFDX_AUTH_URL input coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install sf CLI pre-check
        shell: bash
        run: |
          # Verify npm is available
          npm --version
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@fake.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: "10"
          SOURCE_DIRECTORY: force-app
      - name: Assert sf CLI was installed
        run: |
          # The action should have installed sf CLI before failing at login
          if sf --version > /dev/null 2>&1; then
            echo "PASS: sf CLI is installed"
          else
            echo "FAIL: sf CLI was not installed"
            exit 1
          fi
      - name: Assert action failed at login (not at CLI install)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because we used a fake SFDX_AUTH_URL
          # but it should have gotten past the CLI install step
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with fake credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
