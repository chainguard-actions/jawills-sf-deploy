name: Test dry-run input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory for manifest generation
        run: |
          mkdir -p force-app/main/default
          echo "PASS: source directory created"

      - name: Attempt action with DRY_RUN=true (expected to fail at login)
        id: action
        uses: .
        continue-on-error: true
        with:
          DRY_RUN: "true"
          TEST_LEVEL: RunLocalTests
          WAIT: 10
          SOURCE_DIRECTORY: force-app
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@invalid.salesforce.com"

      - name: Assert action failed at login (not at CLI install)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the SFDX_AUTH_URL is invalid
          # but it should NOT fail at the CLI install step
          # We verify the outcome is 'failure' (login failed) not some other error
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded - this may indicate a real org was connected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid SFDX_AUTH_URL)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
