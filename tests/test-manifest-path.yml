name: Test deploy with manifest path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy manifest file
        run: |
          mkdir -p manifest
          cat > manifest/package.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
              <version>58.0</version>
          </Package>
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::dummy_token@example.salesforce.com"
          MANIFEST_PATH: "manifest/package.xml"
          TEST_LEVEL: NoTestRun
          WAIT: 1
      - name: Assert action ran (login expected to fail without real org)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
