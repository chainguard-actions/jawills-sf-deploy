name: Test basic deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: "10"
          SOURCE_DIRECTORY: force-app
        continue-on-error: true
      - name: Assert action ran (login step expected to fail with invalid URL)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid SFDX_AUTH_URL"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
