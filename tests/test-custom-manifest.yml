name: Test custom manifest path deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock Salesforce CLI
        run: |
          mkdir -p "$HOME/.local/bin"

          # Mock npm to skip actual install
          cat > "$HOME/.local/bin/npm" << 'NPMEOF'
          #!/bin/sh
          echo "npm mock: $*"
          exit 0
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"

          # Track whether generate manifest was called (it should NOT be)
          MANIFEST_CALLED_FILE="/tmp/manifest_called"
          rm -f "$MANIFEST_CALLED_FILE"

          # Mock sf CLI
          cat > "$HOME/.local/bin/sf" << 'SFEOF'
          #!/bin/sh
          echo "sf mock: $*" >&2
          case "$*" in
            *"--version"*)
              echo "@salesforce/cli/2.0.0 linux-x64 node-v18.0.0"
              exit 0
              ;;
            *"org login sfdx-url"*)
              echo '{"status":0,"result":{"orgId":"00D000000000001AAA","username":"test@example.com"}}'
              exit 0
              ;;
            *"project generate manifest"*)
              # This should NOT be called when MANIFEST_PATH is set
              touch /tmp/manifest_called
              echo "ERROR: generate manifest should not be called when MANIFEST_PATH is set" >&2
              exit 1
              ;;
            *"project deploy start"*)
              # Validate that the custom manifest path is used
              case "$*" in
                *"custom/package.xml"*)
                  echo '{"status":0,"result":{"id":"0Af000000000003CCC","status":"Pending"}}' ;;
                *)
                  echo "FAIL: custom manifest path not passed to deploy start" >&2
                  echo "Got: $*" >&2
                  exit 1 ;;
              esac
              exit 0
              ;;
            *"project deploy resume"*)
              cat << 'RESUMEJSON'
          {
            "status": 0,
            "result": {
              "id": "0Af000000000003CCC",
              "status": "Succeeded",
              "checkOnly": false,
              "numberComponentsDeployed": 1,
              "numberComponentErrors": 0,
              "details": {
                "componentSuccesses": [
                  {"fullName": "MyClass", "componentType": "ApexClass", "created": false, "changed": true, "deleted": false}
                ],
                "componentFailures": []
              }
            }
          }
          RESUMEJSON
              exit 0
              ;;
            *)
              echo "Unknown sf command: $*" >&2
              exit 1
              ;;
          esac
          SFEOF
          chmod +x "$HOME/.local/bin/sf"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create custom manifest file
        run: |
          mkdir -p custom
          cat > custom/package.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
            <types>
              <members>MyClass</members>
              <name>ApexClass</name>
            </types>
            <version>58.0</version>
          </Package>
          XMLEOF

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          MANIFEST_PATH: "custom/package.xml"
          TEST_LEVEL: NoTestRun
          WAIT: 10

      - name: Assert generate manifest was NOT called
        run: |
          if [ -f /tmp/manifest_called ]; then
            echo "FAIL: project generate manifest was called even though MANIFEST_PATH was set"
            exit 1
          fi
          echo "PASS: generate manifest was correctly skipped"

      - name: Assert deployment_id output
        env:
          ACTUAL: ${{ steps.action.outputs.deployment_id }}
        run: |
          echo "actual deployment_id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deployment_id should not be empty"
            exit 1
          fi
          echo "PASS: deployment_id=$ACTUAL"

      - name: Assert deploy_status is Succeeded
        env:
          ACTUAL: ${{ steps.action.outputs.deploy_status }}
        run: |
          echo "actual deploy_status: $ACTUAL"
          if [ "$ACTUAL" != "Succeeded" ]; then
            echo "FAIL: expected deploy_status=Succeeded, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
