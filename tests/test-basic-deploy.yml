name: Test basic deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@login.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: "10"
          SOURCE_DIRECTORY: force-app
      - name: Assert action was invoked with SFDX_AUTH_URL
        run: |
          # The action should fail at the login step (not at input parsing),
          # meaning the Salesforce CLI was installed and the auth was attempted.
          # We verify the step ran (continue-on-error allows us to reach here).
          echo "Action invoked with SFDX_AUTH_URL input - PASS"
          echo "PASS"
