name: Test basic deploy with SFDX_AUTH_URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy source directory
        run: |
          mkdir -p force-app
          echo "dummy" > force-app/dummy.txt
      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: 30
          SOURCE_DIRECTORY: force-app
        continue-on-error: true
      - name: Assert action ran (install and login attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at login/deploy without real credentials
          # but it must have been attempted (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
