name: Test NoTestRun test level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock sf CLI and npm
        run: |
          mkdir -p "$HOME/.local/bin"

          # Mock npm
          cat > "$HOME/.local/bin/npm" << 'EOF'
          #!/bin/sh
          echo "npm mock: $*"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/npm"

          # Mock sf CLI that records deploy flags
          cat > "$HOME/.local/bin/sf" << 'EOF'
          #!/bin/sh
          echo "sf mock called with: $*"
          case "$*" in
            *--version*)
              echo "sf/2.0.0 linux-x64 node-v18.0.0"
              ;;
            *"org login sfdx-url"*)
              echo "Successfully authorized test@example.com"
              ;;
            *"project generate manifest"*)
              mkdir -p manifest
              cat > manifest/package.xml << 'PKGEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
              <version>57.0</version>
          </Package>
          PKGEOF
              echo "Generated manifest/package.xml"
              ;;
            *"project deploy start"*)
              # Record the full command for assertion
              echo "$*" > /tmp/sf-deploy-flags.txt
              echo "Deploy ID: 0Af000000000003"
              echo "Status: Succeeded"
              echo "Deployed 0 source files to test org"
              ;;
            *)
              echo "Unknown sf command: $*"
              exit 1
              ;;
          esac
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/sf"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create source directory
        run: mkdir -p force-app

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake-token@test.salesforce.com"
          TEST_LEVEL: NoTestRun
          WAIT: "5"
          SOURCE_DIRECTORY: force-app

      - name: Assert NoTestRun test level was passed
        run: |
          echo "Checking deploy flags..."
          if [ ! -f /tmp/sf-deploy-flags.txt ]; then
            echo "FAIL: deploy was never called"
            exit 1
          fi
          DEPLOY_FLAGS=$(cat /tmp/sf-deploy-flags.txt)
          echo "Deploy flags: $DEPLOY_FLAGS"
          if echo "$DEPLOY_FLAGS" | grep -q "NoTestRun"; then
            echo "PASS: NoTestRun test level was present"
          else
            echo "FAIL: NoTestRun test level was not found in deploy command"
            exit 1
          fi
          # Also verify --dry-run is NOT present (not a dry run)
          if echo "$DEPLOY_FLAGS" | grep -q -- "--dry-run"; then
            echo "FAIL: --dry-run should not be present for a non-dry-run deploy"
            exit 1
          fi
          echo "PASS: --dry-run correctly absent"
