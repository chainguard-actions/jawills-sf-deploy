name: Test basic dry run invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy source directory
        run: |
          mkdir -p force-app/main/default/classes
          cat > force-app/main/default/classes/HelloWorld.cls << 'EOF'
          public class HelloWorld {
              public static void sayHello() {
                  System.debug('Hello World');
              }
          }
          EOF
          cat > force-app/main/default/classes/HelloWorld.cls-meta.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <ApexClass xmlns="http://soap.sforce.com/2006/04/metadata">
              <apiVersion>58.0</apiVersion>
              <status>Active</status>
          </ApexClass>
          EOF

      - name: Run action (expect failure at login step — no real org)
        id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          DRY_RUN: "true"
          TEST_LEVEL: "RunLocalTests"
          WAIT: "30"
          SOURCE_DIRECTORY: "force-app"

      - name: Assert Salesforce CLI was installed before login failure
        run: |
          if ! command -v sf &> /dev/null; then
            echo "FAIL: sf CLI not found in PATH — Install step did not run"
            exit 1
          fi
          echo "PASS: sf CLI is available (Install step ran successfully)"
          sf --version
