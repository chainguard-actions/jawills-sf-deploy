name: Test apex test result outputs (mocked sf CLI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock sf binary with test results
        run: |
          mkdir -p "$HOME/.local/bin"

          cat > "$HOME/.local/bin/sf" << 'SFEOF'
          #!/usr/bin/env bash
          case "$*" in
            *"--version"*)
              echo "@salesforce/cli/2.0.0 linux-x64 node-v18.0.0"
              exit 0
              ;;
            *"org login sfdx-url"*)
              echo "Successfully authorized mock@example.com"
              exit 0
              ;;
            *"project generate manifest"*)
              mkdir -p manifest
              cat > manifest/package.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
              <version>58.0</version>
          </Package>
          XMLEOF
              exit 0
              ;;
            *"project deploy start"*)
              echo '{"status":0,"result":{"id":"0Af000000000004DDD","status":"Pending"}}'
              exit 0
              ;;
            *"project deploy resume"*)
              # Return a result with Apex test data including code coverage
              echo '{
                "status": 0,
                "result": {
                  "id": "0Af000000000004DDD",
                  "status": "Succeeded",
                  "checkOnly": false,
                  "numberComponentsDeployed": 1,
                  "numberComponentErrors": 0,
                  "details": {
                    "componentSuccesses": [
                      {
                        "fullName": "MyClass",
                        "componentType": "ApexClass",
                        "created": false,
                        "changed": true,
                        "deleted": false
                      }
                    ],
                    "componentFailures": [],
                    "runTestResult": {
                      "numTestsRun": 5,
                      "numFailures": 0,
                      "failures": [],
                      "codeCoverage": [
                        {
                          "name": "MyClass",
                          "numLocations": 100,
                          "numLocationsNotCovered": 20
                        },
                        {
                          "name": "AnotherClass",
                          "numLocations": 50,
                          "numLocationsNotCovered": 5
                        }
                      ]
                    }
                  }
                }
              }'
              exit 0
              ;;
            *)
              echo "mock sf: unknown command: $*" >&2
              exit 1
              ;;
          esac
          SFEOF
          chmod +x "$HOME/.local/bin/sf"

          cat > "$HOME/.local/bin/npm" << 'NPMEOF'
          #!/usr/bin/env bash
          echo "mock npm: $*"
          exit 0
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create dummy source directory
        run: mkdir -p force-app

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::mock_token@mock.salesforce.com"
          TEST_LEVEL: "RunLocalTests"
          WAIT: "1"

      - name: Assert tests_run output
        env:
          ACTUAL: ${{ steps.action.outputs.tests_run }}
        run: |
          echo "actual tests_run: $ACTUAL"
          if [ "$ACTUAL" != "5" ]; then
            echo "FAIL: expected tests_run='5', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert tests_failed output
        env:
          ACTUAL: ${{ steps.action.outputs.tests_failed }}
        run: |
          echo "actual tests_failed: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected tests_failed='0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert apex_org_wide_coverage_percent output
        env:
          ACTUAL: ${{ steps.action.outputs.apex_org_wide_coverage_percent }}
        run: |
          echo "actual apex_org_wide_coverage_percent: $ACTUAL"
          # 100+50=150 total, 20+5=25 not covered, so 125/150 = 83.33%
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: apex_org_wide_coverage_percent should not be empty"
            exit 1
          fi
          echo "PASS: apex_org_wide_coverage_percent=$ACTUAL"

      - name: Assert deploy_status output
        env:
          ACTUAL: ${{ steps.action.outputs.deploy_status }}
        run: |
          echo "actual deploy_status: $ACTUAL"
          if [ "$ACTUAL" != "Succeeded" ]; then
            echo "FAIL: expected 'Succeeded', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
