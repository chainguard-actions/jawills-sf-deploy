name: Test dry run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@test.salesforce.com"
          DRY_RUN: "true"
          TEST_LEVEL: RunLocalTests
          WAIT: "10"
          SOURCE_DIRECTORY: force-app
      - name: Assert action was invoked with DRY_RUN input
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at login with an invalid auth URL.
          # We verify it ran (not skipped) and failed at the expected step.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with DRY_RUN and SFDX_AUTH_URL inputs"
