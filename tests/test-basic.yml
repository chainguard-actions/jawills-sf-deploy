name: Test basic deploy (SFDX_AUTH_URL coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@example.my.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: "10"
          SOURCE_DIRECTORY: force-app
      - name: Assert Salesforce CLI was installed
        run: |
          if ! command -v sf &> /dev/null; then
            echo "FAIL: Salesforce CLI (sf) was not found on PATH"
            exit 1
          fi
          echo "PASS: Salesforce CLI is installed"
          sf --version
