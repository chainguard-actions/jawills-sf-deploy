name: Test resume deployment with existing deployment ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock Salesforce CLI
        run: |
          mkdir -p "$HOME/.local/bin"

          # Mock npm to skip actual install
          cat > "$HOME/.local/bin/npm" << 'NPMEOF'
          #!/bin/sh
          echo "npm mock: $*"
          exit 0
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"

          # Mock sf CLI
          cat > "$HOME/.local/bin/sf" << 'SFEOF'
          #!/bin/sh
          echo "sf mock: $*" >&2
          case "$*" in
            *"--version"*)
              echo "@salesforce/cli/2.0.0 linux-x64 node-v18.0.0"
              exit 0
              ;;
            *"org login sfdx-url"*)
              echo '{"status":0,"result":{"orgId":"00D000000000001AAA","username":"test@example.com"}}'
              exit 0
              ;;
            *"project generate manifest"*)
              mkdir -p manifest
              echo '<?xml version="1.0" encoding="UTF-8"?><Package xmlns="http://soap.sforce.com/2006/04/metadata"><version>58.0</version></Package>' > manifest/package.xml
              exit 0
              ;;
            *"project deploy start"*)
              # Validate that --job-id flag is present when DEPLOYMENT_ID is set
              case "$*" in
                *"--job-id"*)
                  echo '{"status":0,"result":{"id":"0Af000000000004DDD","status":"Pending"}}' ;;
                *)
                  echo "FAIL: --job-id flag not passed to deploy start" >&2
                  echo "Got: $*" >&2
                  exit 1 ;;
              esac
              exit 0
              ;;
            *"project deploy resume"*)
              cat << 'RESUMEJSON'
          {
            "status": 0,
            "result": {
              "id": "0Af000000000004DDD",
              "status": "Succeeded",
              "checkOnly": false,
              "numberComponentsDeployed": 3,
              "numberComponentErrors": 0,
              "details": {
                "componentSuccesses": [
                  {"fullName": "ClassA", "componentType": "ApexClass", "created": false, "changed": true, "deleted": false},
                  {"fullName": "ClassB", "componentType": "ApexClass", "created": true, "changed": false, "deleted": false},
                  {"fullName": "TriggerA", "componentType": "ApexTrigger", "created": false, "changed": true, "deleted": false}
                ],
                "componentFailures": [],
                "runTestResult": {
                  "numTestsRun": "10",
                  "numFailures": "0",
                  "failures": []
                }
              }
            }
          }
          RESUMEJSON
              exit 0
              ;;
            *)
              echo "Unknown sf command: $*" >&2
              exit 1
              ;;
          esac
          SFEOF
          chmod +x "$HOME/.local/bin/sf"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create source directory
        run: mkdir -p force-app

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          DEPLOYMENT_ID: "0Af000000000004DDD"
          TEST_LEVEL: RunLocalTests
          WAIT: 10
          SOURCE_DIRECTORY: force-app

      - name: Assert deployment_id output matches provided ID
        env:
          ACTUAL: ${{ steps.action.outputs.deployment_id }}
        run: |
          echo "actual deployment_id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deployment_id should not be empty"
            exit 1
          fi
          echo "PASS: deployment_id=$ACTUAL"

      - name: Assert deploy_status is Succeeded
        env:
          ACTUAL: ${{ steps.action.outputs.deploy_status }}
        run: |
          echo "actual deploy_status: $ACTUAL"
          if [ "$ACTUAL" != "Succeeded" ]; then
            echo "FAIL: expected deploy_status=Succeeded, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert tests_run output
        env:
          ACTUAL: ${{ steps.action.outputs.tests_run }}
        run: |
          echo "actual tests_run: $ACTUAL"
          if [ "$ACTUAL" != "10" ]; then
            echo "FAIL: expected tests_run=10, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
