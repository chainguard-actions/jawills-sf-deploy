name: Test dry run deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy source directory
        run: mkdir -p force-app
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@example.salesforce.com"
          DRY_RUN: "true"
          TEST_LEVEL: RunLocalTests
          WAIT: "30"
          SOURCE_DIRECTORY: force-app
      - name: Assert action was invoked with DRY_RUN input
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at login since no real org is available.
          # We only verify the step was reached (not skipped), meaning inputs were accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with DRY_RUN input"
