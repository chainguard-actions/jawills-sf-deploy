name: Test with manifest path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@test.salesforce.com"
          MANIFEST_PATH: "manifest/package.xml"
          TEST_LEVEL: NoTestRun
          WAIT: 1
        continue-on-error: true
      - name: Assert action ran with MANIFEST_PATH (expected to fail without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because SFDX_AUTH_URL is invalid.
          # We just verify it ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with MANIFEST_PATH set (outcome=$OUTCOME)"
