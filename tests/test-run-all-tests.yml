name: Test RunAllTestsInOrg test level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy source directory
        run: mkdir -p force-app

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::invalid_token@test.salesforce.com"
          SOURCE_DIRECTORY: force-app
          TEST_LEVEL: RunAllTestsInOrg
          WAIT: "30"
        continue-on-error: true

      - name: Assert sf CLI was installed
        run: |
          if ! command -v sf &>/dev/null; then
            echo "FAIL: sf CLI was not installed by the action"
            exit 1
          fi
          echo "PASS: sf CLI is installed"
          sf --version

      - name: Assert action outcome with RunAllTestsInOrg
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With an invalid auth URL, the action should fail at login
          # but the RunAllTestsInOrg TEST_LEVEL input should be accepted without error
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded (would need a real org)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid auth URL (RunAllTestsInOrg accepted)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
