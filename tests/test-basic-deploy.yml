name: Test basic deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock Salesforce CLI
        run: |
          mkdir -p "$HOME/.local/bin"

          # Mock npm to skip actual install
          cat > "$HOME/.local/bin/npm" << 'NPMEOF'
          #!/bin/sh
          # If installing @salesforce/cli, do nothing (sf mock is already on PATH)
          echo "npm mock: $*"
          exit 0
          NPMEOF
          chmod +x "$HOME/.local/bin/npm"

          # Fake deployment ID
          FAKE_ID="0Af000000000001AAA"

          # Mock sf CLI
          cat > "$HOME/.local/bin/sf" << SFEOF
          #!/bin/sh
          echo "sf mock: \$*" >&2
          case "\$*" in
            *"--version"*)
              echo "@salesforce/cli/2.0.0 linux-x64 node-v18.0.0"
              exit 0
              ;;
            *"org login sfdx-url"*)
              echo '{"status":0,"result":{"orgId":"00D000000000001AAA","username":"test@example.com"}}'
              exit 0
              ;;
            *"project generate manifest"*)
              mkdir -p manifest
              echo '<?xml version="1.0" encoding="UTF-8"?><Package xmlns="http://soap.sforce.com/2006/04/metadata"><version>58.0</version></Package>' > manifest/package.xml
              exit 0
              ;;
            *"project deploy start"*)
              echo '{"status":0,"result":{"id":"${FAKE_ID}","status":"Pending"}}'
              exit 0
              ;;
            *"project deploy resume"*)
              cat << 'RESUMEJSON'
          {
            "status": 0,
            "result": {
              "id": "0Af000000000001AAA",
              "status": "Succeeded",
              "checkOnly": false,
              "numberComponentsDeployed": 2,
              "numberComponentErrors": 0,
              "details": {
                "componentSuccesses": [
                  {"fullName": "MyClass", "componentType": "ApexClass", "created": false, "changed": true, "deleted": false},
                  {"fullName": "MyTrigger", "componentType": "ApexTrigger", "created": true, "changed": false, "deleted": false}
                ],
                "componentFailures": [],
                "runTestResult": {
                  "numTestsRun": "5",
                  "numFailures": "0",
                  "failures": [],
                  "codeCoverage": [
                    {"name": "MyClass", "numLocations": "10", "numLocationsNotCovered": "2"},
                    {"name": "MyTrigger", "numLocations": "8", "numLocationsNotCovered": "1"}
                  ]
                }
              }
            }
          }
          RESUMEJSON
              exit 0
              ;;
            *)
              echo "Unknown sf command: \$*" >&2
              exit 1
              ;;
          esac
          SFEOF
          chmod +x "$HOME/.local/bin/sf"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create source directory
        run: mkdir -p force-app

      - id: action
        uses: .
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: 10
          SOURCE_DIRECTORY: force-app

      - name: Assert deployment_id output
        env:
          ACTUAL: ${{ steps.action.outputs.deployment_id }}
        run: |
          echo "actual deployment_id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: deployment_id should not be empty"
            exit 1
          fi
          echo "PASS: deployment_id=$ACTUAL"

      - name: Assert deploy_status output
        env:
          ACTUAL: ${{ steps.action.outputs.deploy_status }}
        run: |
          echo "actual deploy_status: $ACTUAL"
          if [ "$ACTUAL" != "Succeeded" ]; then
            echo "FAIL: expected deploy_status=Succeeded, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert tests_run output
        env:
          ACTUAL: ${{ steps.action.outputs.tests_run }}
        run: |
          echo "actual tests_run: $ACTUAL"
          if [ "$ACTUAL" != "5" ]; then
            echo "FAIL: expected tests_run=5, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert tests_failed output
        env:
          ACTUAL: ${{ steps.action.outputs.tests_failed }}
        run: |
          echo "actual tests_failed: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected tests_failed=0, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert apex_org_wide_coverage_percent output
        env:
          ACTUAL: ${{ steps.action.outputs.apex_org_wide_coverage_percent }}
        run: |
          echo "actual apex_org_wide_coverage_percent: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: apex_org_wide_coverage_percent should not be empty"
            exit 1
          fi
          echo "PASS: coverage=$ACTUAL%"
