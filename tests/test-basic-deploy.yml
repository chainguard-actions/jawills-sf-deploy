name: Test basic deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy source directory
        run: |
          mkdir -p force-app
          echo "<!-- dummy -->" > force-app/dummy.xml
      - id: action
        uses: .
        continue-on-error: true
        with:
          SFDX_AUTH_URL: "force://PlatformCLI::fake_token@test.salesforce.com"
          TEST_LEVEL: RunLocalTests
          WAIT: 1
          SOURCE_DIRECTORY: force-app
      - name: Assert action ran (auth failure expected without real org)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at login since we have no real org.
          # We just verify the step was reached and inputs were accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with SFDX_AUTH_URL input covered"
