name: Salesforce Metadata Deploy
description: Builds and deploys metadata to a specified environment
inputs:
  DRY_RUN:
    description: "Validate deploy and run Apex tests but don't save to the org."
    type: boolean
  TEST_LEVEL:
    description: "Deployment Apex testing level."
    type: choice
    default: RunLocalTests
    options:
      - NoTestRun
      - RunSpecifiedTests
      - RunLocalTests
      - RunAllTestsInOrg
  WAIT:
    description: "Number of minutes to wait for command to complete and display results."
    type: number
    default: 30
  SOURCE_DIRECTORY:
    description: "Path to the local source files to deploy."
    type: string
    default: force-app
  SFDX_AUTH_URL:
    description: "The auth url tied to your deployment environment"
    type: string
    required: true
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Install Salesforce CLI
      shell: bash
      run: |
        npm install -g @salesforce/cli
        sf --version
    - name: Login to Environment
      shell: bash
      env:
        SFDX_AUTH_URL: ${{ inputs.SFDX_AUTH_URL }}
      run: |
        sf org login sfdx-url --set-default --sfdx-url-file <(echo "$SFDX_AUTH_URL")
    - name: Generate package.xml
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.SOURCE_DIRECTORY }}
      run: |
        sf project generate manifest --source-dir "$SOURCE_DIRECTORY" --output-dir manifest
    - name: Deploy to Environment
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.SOURCE_DIRECTORY }}
        TEST_LEVEL: ${{ inputs.TEST_LEVEL }}
        WAIT: ${{ inputs.WAIT }}
        DRY_RUN: ${{ inputs.DRY_RUN }}
      run: |
        deployFlags=(
            --manifest manifest/package.xml
            --wait "$WAIT"
            --test-level "$TEST_LEVEL"
            --verbose
          )
        if [ "$DRY_RUN" = "true" ]; then
          deployFlags+=( --dry-run )
        fi
        sf project deploy start "${deployFlags[@]}"
